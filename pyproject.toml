[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wsbench"
version = "0.1.0"
description = "An executable workbench for claims about neural-network weights"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.4", "numpy>=1.26", "scipy>=1.11", "safetensors>=0.4",
    "tokenizers>=0.15", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "anthropic>=1.0", "pytest>=8",
]

[project.scripts]
wsbench = "wsbench.cli:main"

[tool.setuptools.packages.find]
include = ["wsbench*"]

[tool.setuptools.package-data]
wsbench = ["examples/*.wsl", "server/static/*"]

[tool.pytest.ini_options]
addopts = "-m 'not network and not live and not slow'"
markers = ["network: downloads models or ARC data", "live: uses the paid LLM API", "slow: trains the grokking models"]
