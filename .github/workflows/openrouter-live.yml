name: OpenRouter live tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live-test dependencies
        run: python -m pip install 'pytest>=8' 'httpx>=0.27' 'fastapi>=0.110'
      - name: Test the three default models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::The OPENROUTER_API_KEY repository secret is missing."
            exit 1
          fi
          python -m pytest -q -s -m live tests/test_assist_mock.py::test_live_translation
